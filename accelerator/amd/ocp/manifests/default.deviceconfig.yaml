apiVersion: amd.com/v1alpha1
kind: DeviceConfig
metadata:
  name: default
  namespace: openshift-amd-gpu
spec:
  devicePlugin:
  #  devicePluginImage: docker.io/rocm/k8s-device-plugin:latest
    enableDevicePlugin: true
  #  enableNodeLabeller: true
  #  kubeletSocketPath: /var/lib/kubelet/device-plugins
  #  nodeLabellerImage: docker.io/rocm/k8s-device-plugin:labeller-latest
  driver:
    #driverType: container
    enable: true
    version: "31.40.1"
    useSourceImage: true
  metricsExporter:
    enable: true
    prometheus:
      serviceMonitor:
        enable: true
        honorLabels: true
  selector:
    feature.node.kubernetes.io/amd-gpu: "true"
