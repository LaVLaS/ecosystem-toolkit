apiVersion: nfd.openshift.io/v1
kind: NodeFeatureDiscovery
metadata:
  name: amdgpu-operator-nfd-instance
  namespace: openshift-nfd
spec:
  workerConfig:
    configData: |
      core:
        sleepInterval: 60s
      sources:
        pci:
          deviceClassWhitelist:
            - "0200"
            - "03"
            - "12"
          deviceLabelFields:
            - "vendor"
            - "device"
        custom:
        - name: amd-gpu
          labels:
            feature.node.kubernetes.io/amd-gpu: "true"
          matchAny:
            - matchFeatures:
                - feature: pci.device
                  matchExpressions:
                    vendor: {op: In, value: ["1002"]}
                    device: {op: In, value: [
                      "75a3", # MI355X
                      "75a0", # MI350X
                      "75a8", # MI350P
                      "74a5", # MI325X
                      "74a2", # MI308X
                      "74a8", # MI308X-HF
                      "74a0", # MI300A
                      "74a1", # MI300X
                      "74a9", # MI300X-HF
                      "740f", # MI210
                      "7408", # MI250X
                      "740c", # MI250/MI250X
                      "738c", # MI100
                      "738e", # MI100
                      # AMD Radeon Pro
                      "7460", # V710
                      "7448", # W7900
                      "744b", # W7900D
                      "744a", # W7900 Dual Slot
                      "7449", # W7800 48GB
                      "745e", # W7800
                      "73a2", # W6900X
                      "73a3", # W6800 GL-XL
                      "73ab", # W6800X / W6800X Duo
                      "73a1", # V620
                      "7551", # AI PRO R9700 / R9700S / R9600D
                      # AMD Radeon
                      "7550", # RX 9070 / 9070 XT
                      "744c", # RX 7900 XT / 7900 XTX / 7900 GRE / 7900M
                      "73af", # RX 6900 XT
                      "73bf", # RX 6800 / 6800 XT / 6900 XT
                      "7590"  # RX 9060 XT
                    ]}
        - name: amd-vgpu
          labels:
            feature.node.kubernetes.io/amd-vgpu: "true"
          matchAny:
            - matchFeatures:
                - feature: pci.device
                  matchExpressions:
                    vendor: {op: In, value: ["1002"]}
                    device: {op: In, value: [
                      "75b3", # MI355X VF
                      "75b0", # MI350X VF
                      "75b8", # MI350P VF
                      "74b9", # MI325X VF
                      "74b6", # MI308X VF
                      "74bc", # MI308X-HF VF
                      "74b5", # MI300X VF
                      "74bd", # MI300X-HF VF
                      "7410", # MI210 VF
                      # AMD Radeon Pro
                      "7461", # V710 MxGPU
                      "73ae"  # V620 MxGPU
                    ]}
